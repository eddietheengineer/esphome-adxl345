# Classic ESP32 (Xtensa) / ESP-IDF — covers Xtensa + the IDF framework.
# Same free I2C pins as the classic ESP32 Arduino variant.
substitutions:
  sda: GPIO21
  scl: GPIO22
esphome:
  name: adxl345-test-esp32-idf

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

packages:
  adxl345: !include common.yaml
