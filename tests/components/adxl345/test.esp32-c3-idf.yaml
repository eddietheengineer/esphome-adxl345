# ESP32-C3 (RISC-V) / ESP-IDF — second framework for the C3 architecture.
# Same XIAO C3 I2C pins as the Arduino variant.
substitutions:
  sda: GPIO6
  scl: GPIO7

esphome:
  name: adxl345-test-c3-idf

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

packages:
  adxl345: !include common.yaml
