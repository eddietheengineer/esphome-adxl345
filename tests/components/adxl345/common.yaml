# Shared ADXL345 test configuration.
#
# Included as a named package by each test.<platform>.yaml file. The
# `external_components` entry loads the component from the repo's
# components/ folder (three levels up from this file).
#
# The two I2C pins are parameterised with substitutions (sda /
# scl) so each per-platform test file can supply pins that are valid
# for that board. This file is otherwise platform-agnostic: it defines the
# I2C bus, the ADXL345 component, and every sensor / binary-sensor the
# component exposes.

external_components:
  - source:
      type: local
      path: ../../../components

i2c:
  sda: ${sda}
  scl: ${scl}
  frequency: 400 kHz

adxl345:
  id: adxl345_sensor
  name: ADXL345
  output_rate: 100 Hz
  range: 4 g
  full_resolution: true
  low_power: false
  # Exercise the interrupt / threshold registers so the binary-sensor
  # callbacks and the INT_SOURCE polling path are compiled.
  threshold_tap: 40
  tap_duration: 200
  tap_latency: 50
  tap_window: 200
  threshold_activity: 30
  threshold_inactivity: 20
  time_inactivity: 10
  threshold_free_fall: 7
  time_free_fall: 20
  int_enable: 0xFF
  int_map: 0x00
  offset_x: 0
  offset_y: 0
  offset_z: 0
  # Vibration analysis: FFT of the Y axis, reporting the dominant frequency,
  # its amplitude, and the resulting deflection. Requires a 400 kHz I2C bus.
  vibration:
    axis: y
    sample_rate: 1000
    window: 2s
    min_frequency: 1

sensor:
  - platform: adxl345
    name: "ADXL345 X Acceleration"
    axis: x
    adxl345_id: adxl345_sensor
    id: accel_x

  - platform: adxl345
    name: "ADXL345 Y Acceleration"
    axis: y
    adxl345_id: adxl345_sensor
    id: accel_y

  - platform: adxl345
    name: "ADXL345 Z Acceleration"
    axis: z
    adxl345_id: adxl345_sensor
    id: accel_z

  - platform: adxl345
    name: "ADXL345 Magnitude"
    axis: magnitude
    adxl345_id: adxl345_sensor
    id: accel_mag

  - platform: adxl345
    name: "ADXL345 Tilt X"
    axis: tilt_x
    adxl345_id: adxl345_sensor
    id: tilt_x

  - platform: adxl345
    name: "ADXL345 Tilt Y"
    axis: tilt_y
    adxl345_id: adxl345_sensor
    id: tilt_y

  - platform: adxl345
    name: "ADXL345 Tilt Z"
    axis: tilt_z
    adxl345_id: adxl345_sensor
    id: tilt_z

  # Vibration analysis (FFT of the Y axis).
  - platform: adxl345
    name: "ADXL345 Vibration Frequency"
    axis: vibration_frequency
    adxl345_id: adxl345_sensor
    id: vib_freq

  - platform: adxl345
    name: "ADXL345 Vibration Amplitude"
    axis: vibration_amplitude
    adxl345_id: adxl345_sensor
    id: vib_amp

  - platform: adxl345
    name: "ADXL345 Vibration Deflection"
    axis: vibration_deflection
    adxl345_id: adxl345_sensor
    id: vib_defl

binary_sensor:
  - platform: adxl345
    name: "ADXL345 Data Ready"
    source: data_ready
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Single Tap"
    source: single_tap
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Double Tap"
    source: double_tap
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Activity"
    source: activity
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Inactivity"
    source: inactivity
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Free Fall"
    source: free_fall
    adxl345_id: adxl345_sensor
