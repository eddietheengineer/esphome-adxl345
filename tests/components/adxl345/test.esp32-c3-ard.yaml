# ESP32-C3 (RISC-V) / Arduino — matches the Seeed XIAO ESP32-C3 target.
# Pins are the XIAO C3 I2C mapping: D4/D5 -> GPIO6/7.
substitutions:
  sda: GPIO6
  scl: GPIO7

esphome:
  name: adxl345-test-c3-ard

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

packages:
  adxl345: !include common.yaml
