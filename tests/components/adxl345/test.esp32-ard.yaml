# Classic ESP32 (Xtensa) / Arduino — covers the Xtensa architecture.
# Uses GPIO21/22 (the classic ESP32 I2C pins), which are free on the
# esp32dev board.
substitutions:
  sda: GPIO21
  scl: GPIO22

esphome:
  name: adxl345-test-esp32-ard

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: arduino

packages:
  adxl345: !include common.yaml
