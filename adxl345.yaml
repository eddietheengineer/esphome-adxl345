# =============================================================================
# ADXL345 3-axis accelerometer on a Seeed XIAO ESP32-C3 (I2C mode)
# =============================================================================
#
# Wiring (XIAO ESP32-C3 -> ADXL345 breakout board):
#   3V3  -> VCC    (3.3V)
#   GND  -> GND
#   D4   -> SDA    (GPIO6)
#   D5   -> SCL    (GPIO7)
#
# The ADXL345 has a fixed I2C address of 0x53. The breakout's SDO and CS
# pins are SPI-only and are left unconnected in I2C mode. Breakout boards
# already include the regulator + decoupling caps, so no extra parts are
# needed.
# =============================================================================

esphome:
  name: adxl345-xiao-c3

# Load the ADXL345 component from the local components folder.
external_components:
  - source:
      type: local
      path: ./components

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: arduino

# Enable logging so you can see the ADXL345 setup messages.
logger:

# Enable the I2C bus.
i2c:
  sda: GPIO6    # XIAO D4 -> SDA
  scl: GPIO7    # XIAO D5 -> SCL
  frequency: 400 kHz

# The ADXL345 component (fixed I2C address 0x53).
adxl345:
  id: adxl345_sensor
  name: ADXL345
  output_rate: 100 Hz # sensor output data rate (BW_RATE register)
  range: 4 g          # full-scale range (DATA_FORMAT range bits)
  full_resolution: true
  low_power: false
  # Vibration analysis: FFT of the Y axis, reporting the dominant frequency,
  # its amplitude, and the resulting deflection. Requires a 400 kHz I2C bus.
  vibration:
    axis: y
    sample_rate: 1000
    window: 2s
    min_frequency: 1

# -----------------------------------------------------------------------------
# Acceleration sensors (in g).
sensor:
  - platform: adxl345
    name: "ADXL345 X Acceleration"
    axis: x
    adxl345_id: adxl345_sensor
    id: accel_x

  - platform: adxl345
    name: "ADXL345 Y Acceleration"
    axis: y
    adxl345_id: adxl345_sensor
    id: accel_y

  - platform: adxl345
    name: "ADXL345 Z Acceleration"
    axis: z
    adxl345_id: adxl345_sensor
    id: accel_z

  - platform: adxl345
    name: "ADXL345 Magnitude"
    axis: magnitude
    adxl345_id: adxl345_sensor
    id: accel_mag

  # Tilt sensors (in degrees), derived from the static gravity vector.
  - platform: adxl345
    name: "ADXL345 Tilt X"
    axis: tilt_x
    adxl345_id: adxl345_sensor
    id: tilt_x

  - platform: adxl345
    name: "ADXL345 Tilt Y"
    axis: tilt_y
    adxl345_id: adxl345_sensor
    id: tilt_y

  - platform: adxl345
    name: "ADXL345 Tilt Z"
    axis: tilt_z
    adxl345_id: adxl345_sensor
    id: tilt_z

  # Vibration analysis (FFT of the Y axis).
  - platform: adxl345
    name: "ADXL345 Vibration Frequency"
    axis: vibration_frequency
    adxl345_id: adxl345_sensor
    id: vib_freq

  - platform: adxl345
    name: "ADXL345 Vibration Amplitude"
    axis: vibration_amplitude
    adxl345_id: adxl345_sensor
    id: vib_amp

  - platform: adxl345
    name: "ADXL345 Vibration Deflection"
    axis: vibration_deflection
    adxl345_id: adxl345_sensor
    id: vib_defl

  - platform: adxl345
    name: "ADXL345 Vibration Peak"
    axis: vibration_peak
    adxl345_id: adxl345_sensor
    id: vib_peak

# -----------------------------------------------------------------------------
# Event / interrupt binary sensors.
#
# For tap / activity / inactivity / free-fall to fire, configure the
# corresponding threshold registers on the adxl345 component above, e.g.:
#
#   adxl345:
#     ...
#     threshold_tap: 40        # ~2.5 g tap threshold
#     tap_duration: 200       # ~125 ms
#     tap_latency: 50         # ~62 ms
#     tap_window: 200        # ~250 ms
#     threshold_activity: 30
#     threshold_free_fall: 7  # ~440 m*g*
#     time_free_fall: 20      # ~100 ms
#     int_enable: 0xFF        # enable all interrupt sources
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: adxl345
    name: "ADXL345 Data Ready"
    source: data_ready
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Single Tap"
    source: single_tap
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Double Tap"
    source: double_tap
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Activity"
    source: activity
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Inactivity"
    source: inactivity
    adxl345_id: adxl345_sensor

  - platform: adxl345
    name: "ADXL345 Free Fall"
    source: free_fall
    adxl345_id: adxl345_sensor

# -----------------------------------------------------------------------------
# On-demand raw-data dump. Pressing this button logs the next filled
# vibration window to the serial console as CSV (index,g per line) between
# ### VIBRATION DUMP ### markers, for copying out and analyzing offline.
button:
  - platform: adxl345
    name: "ADXL345 Dump Vibration"
    adxl345_id: adxl345_sensor
